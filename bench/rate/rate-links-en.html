<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>번역 블라인드 평가</title>
<!-- 템플릿: build.mjs가 CSS/JS/데이터를 인라인해 단독 HTML(rate-<lang>.html)을 생성한다 -->
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1e;--card:#fff;--bd:#d9d9d6;--mut:#6b6b70;--acc:#2563eb;--x:#fde68a;--xfg:#5b4400;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#e8e8ea;--card:#1c1c20;--bd:#38383e;--mut:#9a9aa2;--acc:#6ea0ff;--x:#4a3b00;--xfg:#ffe08a;--warn:#fbbf24;--warnbg:#3a2c06}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
.top{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--bd);z-index:5}
h1{font-size:1.1rem;margin:0 0 6px}
.progress{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:var(--acc);transition:width .2s}
.small{font-size:.8rem;color:var(--mut)}
main,#reveal,footer{max-width:820px;margin:0 auto;padding:10px 14px}
.block{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:14px 0}
.block.done{border-color:var(--acc)}
.block h2{font-size:.9rem;margin:0 0 8px;color:var(--mut);font-weight:600}
.src{padding:8px 10px;border-left:3px solid var(--acc);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.fx{background:var(--x);color:var(--xfg);border-radius:4px;padding:0 3px;font-weight:600}
.fx::before{content:"[";}.fx::after{content:"]";}
.miss{color:var(--warn);font-style:italic}
.cand{border-top:1px dashed var(--bd);padding:10px 0}
.cand .lab{font-weight:700;margin-right:6px}
.cand .txt{white-space:pre-wrap;word-break:break-word;margin:4px 0 8px}
.badge{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:6px;font-size:.75rem;padding:1px 6px;margin-left:4px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:2px 0}
.row .n{min-width:4.5em;font-size:.85rem;color:var(--mut)}
.row label{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:2.4em;border:1px solid var(--bd);border-radius:8px;cursor:pointer;user-select:none}
.row label:has(input:checked){background:var(--acc);color:#fff;border-color:var(--acc)}
.row input{position:absolute;opacity:0;pointer-events:none}
.row label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.best label{min-width:4em;padding:0 8px}
textarea{width:100%;min-height:3.2em;margin-top:8px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:6px;font:inherit}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#reveal{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:14px auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
.msg{padding:24px;text-align:center;color:var(--warn)}
@media (max-width:480px){body{font-size:15px}.row .n{min-width:100%}}

</style>
</head>
<body>
<header class="top">
  <h1 id="title">번역 블라인드 평가</h1>
  <div class="progress" aria-label="진행률"><div id="bar"></div></div>
  <div id="progressText" class="small"></div>
</header>
<main id="app"></main>
<section id="reveal" hidden></section>
<footer>
  <div class="actions">
    <button id="download" type="button" class="primary">결과 다운로드</button>
    <button id="reset" type="button">평가 초기화</button>
  </div>
  <p class="small">다운로드한 파일을 <code>bench/results/ratings-&lt;언어&gt;.json</code> 으로 직접 옮겨 두세요 (예: <code>ratings-en.json</code>). 평가 중에는 엔진명이 숨겨지며, 다운로드 파일에만 실제 엔진명이 기록됩니다. 진행 상황은 이 브라우저(localStorage)에 자동 저장됩니다.</p>
</footer>
<script id="data" type="application/json">{"lang":"en","title":"Verhoeven wins Portimar thriller","engines":["apple-mt-marker","mlx-translategemma-4b-4bit-mt","ollama-translategemma-4b-mt"],"blocks":[{"id":"art-link-01","genre":"link","source":[{"k":"t","text":"Team principal "},{"k":"x","text":"Marco Delacroix"},{"k":"t","text":" admitted the call was \"probably one lap too early\" and said the squad would review its simulation tools before the next round."}],"candidates":[{"engine":"apple-mt-marker","parts":[{"k":"t","text":"팀 주관자 "},{"k":"x","text":"Marco Delacroix"},{"k":"t","text":"는 그 호출이 \"아마도 한 바퀴 일찍\"였다고 인정했으며 다음 라운드 전에 팀이 시뮬레이션 도구를 검토할 것이라고 말했다."}],"error":null,"missing":false},{"engine":"mlx-translategemma-4b-4bit-mt","parts":[{"k":"t","text":"팀 책임자 "},{"k":"x","text":"Marco Delacroix"},{"k":"t","text":" “이번 레이스는 ‘대략 한 바퀴는 너무 빠르다’고 인정했으며, 다음 라운드 전에 팀의 시뮬레이션 도구를 검토할 것이라고 밝혔습니다.”"}],"error":null,"missing":false},{"engine":"ollama-translategemma-4b-mt","parts":[{"k":"t","text":"팀 책임자 "},{"k":"x","text":"Marco Delacroix"},{"k":"t","text":" 그들은 \"대회 시작이 아마도 너무 일찍\"이었다는 점을 인정했으며, 다음 라운드 전에 시뮬레이션 도구를 검토할 것이라고 밝혔습니다."}],"error":null,"missing":false}]},{"id":"art-link-02","genre":"link","source":[{"k":"t","text":"The result moves "},{"k":"x","text":"Verhoeven"},{"k":"t","text":" to within 12 points of the championship lead, with seven rounds still to run."}],"candidates":[{"engine":"apple-mt-marker","parts":[{"k":"t","text":"결과는 "},{"k":"x","text":"Verhoeven"},{"k":"t","text":"을 아직 진행해야 할 7라운드 동안 챔피언십 선두에 12점 내로 끌어당긴다."}],"error":null,"missing":false},{"engine":"mlx-translategemma-4b-4bit-mt","parts":[{"k":"t","text":"이번 결과는 "},{"k":"x","text":"Verhoeven"},{"k":"t","text":"를 현재 선두와의 12점 차이 내로 끌어내며, 아직 7라운드가 남았습니다."}],"error":null,"missing":false},{"engine":"ollama-translategemma-4b-mt","parts":[{"k":"t","text":"이 결과는 "},{"k":"x","text":"Verhoeven"},{"k":"t","text":"을 챔피언십 선두와 12점 차이로 만들었으며, 아직 7라운드가 남았습니다."}],"error":null,"missing":false}]},{"id":"art-link-03","genre":"link","source":[{"k":"t","text":"Our full "},{"k":"x","text":"race report and driver ratings"},{"k":"t","text":" are available now, and you can watch the on-board footage from the closing laps below."}],"candidates":[{"engine":"apple-mt-marker","parts":[{"k":"t","text":"우리의 전체 "},{"k":"x","text":"race report and driver ratings"},{"k":"t","text":"이 지금 이용 가능하며, 아래에서 마지막 라운드에서 촬영된 현장 영상을 시청할 수 있습니다."}],"error":null,"missing":false},{"engine":"mlx-translategemma-4b-4bit-mt","parts":[{"k":"t","text":"전체 "},{"k":"x","text":"race report and driver ratings"},{"k":"t","text":" 지금 이용 가능하며, 경기 막바지 영상들을 아래에서 확인하실 수 있습니다."}],"error":null,"missing":false},{"engine":"ollama-translategemma-4b-mt","parts":[{"k":"t","text":"저희의 전체 영상 "},{"k":"x","text":"race report and driver ratings"},{"k":"t","text":"는 현재 시청 가능하며, 경기 막판의 영상은 아래에서 확인하실 수 있습니다."}],"error":null,"missing":false}]},{"id":"art-nav-01","genre":"link","source":[{"k":"t","text":"Related: "},{"k":"x","text":"Why this season's title fight could go down to the final lap"}],"candidates":[{"engine":"apple-mt-marker","parts":[{"k":"t","text":"관련: "},{"k":"x","text":"Why this season's title fight could go down to the final lap"}],"error":null,"missing":false},{"engine":"mlx-translategemma-4b-4bit-mt","parts":[{"k":"t","text":"관련: "},{"k":"x","text":"Why this season's title fight could go down to the final lap"}],"error":null,"missing":false},{"engine":"ollama-translategemma-4b-mt","parts":[{"k":"t","text":"관련: "},{"k":"x","text":"Why this season's title fight could go down to the final lap"}],"error":null,"missing":false}]},{"id":"art-nav-02","genre":"link","source":[{"k":"t","text":"Read more: "},{"k":"x","text":"The 10 drivers who defined the first half of the season"},{"k":"t","text":", "},{"k":"x","text":"Halcyon's upgrade package explained"}],"candidates":[{"engine":"apple-mt-marker","parts":[{"k":"t","text":"더 읽어보기: "},{"k":"x","text":"The 10 drivers who defined the first half of the season"},{"k":"t","text":", "},{"k":"x","text":"Halcyon's upgrade package explained"}],"error":null,"missing":false},{"engine":"mlx-translategemma-4b-4bit-mt","parts":[{"k":"t","text":"더 보기: "},{"k":"x","text":"The 10 drivers who defined the first half of the season"},{"k":"t","text":", "},{"k":"x","text":"Halcyon's upgrade package explained"}],"error":null,"missing":false},{"engine":"ollama-translategemma-4b-mt","parts":[{"k":"t","text":"자세히 보기: "},{"k":"x","text":"The 10 drivers who defined the first half of the season"},{"k":"t","text":", "},{"k":"x","text":"Halcyon's upgrade package explained"}],"error":null,"missing":false}]},{"id":"art-cta-01","genre":"link","source":[{"k":"t","text":"Enjoyed this article? "},{"k":"x","text":"Subscribe to our newsletter"},{"k":"t","text":" to get the biggest stories delivered to your inbox every morning."}],"candidates":[{"engine":"apple-mt-marker","parts":[{"k":"t","text":"이 기사를 즐기셨나요? 매일 아침 가장 큰 뉴스를 받은편지함으로 받아보시려면 "},{"k":"x","text":"Subscribe to our newsletter"},{"k":"t","text":"을 눌러주세요."}],"error":null,"missing":false},{"engine":"mlx-translategemma-4b-4bit-mt","parts":[{"k":"t","text":"이 기사를 재미있게 읽으셨나요? "},{"k":"x","text":"Subscribe to our newsletter"},{"k":"t","text":" 매일 아침, 가장 중요한 뉴스를 받으세요."}],"error":null,"missing":false},{"engine":"ollama-translategemma-4b-mt","parts":[{"k":"t","text":"이 기사를 재미있게 보셨나요? "},{"k":"x","text":"Subscribe to our newsletter"},{"k":"t","text":" 매일 아침, 가장 중요한 소식을 이메일로 받아보세요."}],"error":null,"missing":false}]}]}</script>
<script>
// 블라인드 평가 UI. 데이터는 #data(JSON)에서 읽고, 엔진명은 다운로드 파일에만 기록한다.
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var app = document.getElementById('app');
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  if (!D || !D.blocks || !D.blocks.length) {
    document.getElementById('title').textContent = '번역 블라인드 평가';
    app.appendChild(el('div', 'msg', (D && D.message) || '평가할 데이터가 없습니다. node bench/rate/build.mjs --lang <언어> 로 생성하세요.'));
    document.getElementById('download').disabled = true;
    return;
  }
  document.getElementById('title').textContent = '번역 블라인드 평가 (' + D.lang + ')';
  if (D.message) app.appendChild(el('div', 'msg', D.message));

  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; }
  function rng(seed) { // mulberry32
    return function () {
      seed = (seed + 0x6D2B79F5) >>> 0;
      var t = seed;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(n, seedStr) {
    var a = [], i, r = rng(hash(seedStr));
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var KEY = 'kt-rate-' + D.lang + '-' + hash(JSON.stringify(D.blocks.map(function (b) { return b.id; })) + D.engines.join(','));
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장 불가 환경 무시 */ } }
  function st(id) { return state[id] || (state[id] = { c: {}, best: null, memo: '' }); }

  // 블록별 후보 순서(시드 고정) 및 letter->candidate 매핑
  var order = {};
  D.blocks.forEach(function (b) { order[b.id] = shuffled(b.candidates.length, D.lang + '|' + b.id); });

  function isDone(b) {
    var s = state[b.id];
    if (!s || s.best == null) return false;
    return b.candidates.every(function (c, ci) {
      var k = s.c[ci]; return k && k.n && k.a;
    });
  }
  function updateProgress() {
    var n = D.blocks.filter(isDone).length;
    document.getElementById('bar').style.width = (100 * n / D.blocks.length) + '%';
    document.getElementById('progressText').textContent = n + ' / ' + D.blocks.length + ' 블록 완료';
    D.blocks.forEach(function (b) {
      var e = document.getElementById('blk-' + b.id);
      if (e) e.classList.toggle('done', isDone(b));
    });
  }
  function parts(container, ps) {
    ps.forEach(function (p) {
      var s = el('span', p.k === 'x' ? 'fx' : p.k === 'miss' ? 'miss' : null, p.text);
      container.appendChild(s);
    });
  }
  function scale(name, label, cur, onPick) {
    var row = el('div', 'row');
    row.appendChild(el('span', 'n', label));
    for (var v = 1; v <= 5; v++) {
      (function (v) {
        var lb = el('label'), inp = document.createElement('input');
        inp.type = 'radio'; inp.name = name; inp.value = v; inp.checked = cur === v;
        inp.addEventListener('change', function () { onPick(v); });
        lb.appendChild(inp); lb.appendChild(document.createTextNode(String(v)));
        row.appendChild(lb);
      })(v);
    }
    return row;
  }

  D.blocks.forEach(function (b, bi) {
    var s = st(b.id);
    var box = el('section', 'block'); box.id = 'blk-' + b.id;
    box.appendChild(el('h2', null, (bi + 1) + '. ' + b.genre));
    var src = el('div', 'src'); parts(src, b.source); box.appendChild(src);
    box.appendChild(el('div', 'small', '노란 [대괄호] 항목은 번역하지 않는 고정 항목입니다.'));
    var bestRow = el('div', 'row best');
    bestRow.appendChild(el('span', 'n', '최선'));
    order[b.id].forEach(function (ci, pos) {
      var c = b.candidates[ci];
      var cand = el('div', 'cand');
      var head = el('div');
      head.appendChild(el('span', 'lab', '후보 ' + LET[pos]));
      if (c.error || c.missing) head.appendChild(el('span', 'badge', '⚠ ' + (c.error ? '오류: ' + c.error : '슬롯 누락')));
      cand.appendChild(head);
      var t = el('div', 'txt'); parts(t, c.parts); cand.appendChild(t);
      var cs = s.c[ci] || (s.c[ci] = {});
      cand.appendChild(scale('n-' + b.id + '-' + ci, '자연스러움', cs.n, function (v) { cs.n = v; save(); updateProgress(); }));
      cand.appendChild(scale('a-' + b.id + '-' + ci, '정확성', cs.a, function (v) { cs.a = v; save(); updateProgress(); }));
      box.appendChild(cand);
      var lb = el('label'), inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'best-' + b.id; inp.value = ci; inp.checked = s.best === ci;
      inp.addEventListener('change', function () { s.best = ci; save(); updateProgress(); });
      lb.appendChild(inp); lb.appendChild(document.createTextNode(LET[pos]));
      bestRow.appendChild(lb);
    });
    box.appendChild(bestRow);
    var memo = document.createElement('textarea');
    memo.placeholder = '메모 (선택)'; memo.value = s.memo || '';
    memo.addEventListener('input', function () { s.memo = memo.value; save(); });
    box.appendChild(memo);
    app.appendChild(box);
  });
  updateProgress();

  function build() {
    return {
      lang: D.lang,
      createdAt: new Date().toISOString(),
      ratings: D.blocks.map(function (b) {
        var s = st(b.id);
        return {
          blockId: b.id,
          candidates: order[b.id].map(function (ci, pos) {
            var c = b.candidates[ci], k = s.c[ci] || {};
            return {
              engine: c.engine, label: '후보 ' + LET[pos],
              naturalness: k.n || null, accuracy: k.a || null,
              best: s.best === ci, error: c.error || (c.missing ? 'missing-slots' : null)
            };
          }),
          memo: s.memo || ''
        };
      })
    };
  }
  function mean(a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : null; }
  function fmt(v) { return v == null ? '-' : v.toFixed(2); }
  function reveal(r) {
    var by = {};
    r.ratings.forEach(function (b) {
      b.candidates.forEach(function (c) {
        var e = by[c.engine] || (by[c.engine] = { n: [], a: [], best: 0 });
        if (c.naturalness) e.n.push(c.naturalness);
        if (c.accuracy) e.a.push(c.accuracy);
        if (c.best) e.best++;
      });
    });
    var box = document.getElementById('reveal');
    box.hidden = false; box.textContent = '';
    box.appendChild(el('h2', null, '엔진 공개'));
    var tb = document.createElement('table');
    var hr = tb.insertRow();
    ['엔진', '자연스러움 평균', '정확성 평균', '최선 횟수', '평가 수'].forEach(function (h) { var th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    Object.keys(by).sort(function (x, y) { return (mean(by[y].n) || 0) - (mean(by[x].n) || 0); }).forEach(function (k) {
      var r2 = tb.insertRow(), e = by[k];
      [k, fmt(mean(e.n)), fmt(mean(e.a)), String(e.best), String(e.n.length)].forEach(function (v) { r2.insertCell().textContent = v; });
    });
    box.appendChild(tb);
    box.scrollIntoView && box.scrollIntoView({ behavior: 'smooth' });
  }
  document.getElementById('download').addEventListener('click', function () {
    var r = build();
    var blob = new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'ratings-' + D.lang + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    reveal(r);
  });
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('이 언어의 평가를 모두 지울까요?')) return;
    try { localStorage.removeItem(KEY); } catch (e) { /* 무시 */ }
    location.reload();
  });
})();

</script>
</body>
</html>
